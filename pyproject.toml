[project]
name = "parallel-programming-with-python"
version = "1.0.0"
description = "A hands-on course repository teaching parallel programming in Python: mpi4py, shared memory, OpenMP-equivalent Numba kernels, CUDA, and a real parallel recommender system."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }

[project.optional-dependencies]
mpi = ["mpi4py>=3.1.5"]
gpu = ["numba>=0.58"]
dev = ["pytest>=7.0", "pytest-xdist>=3.0", "ruff>=0.5", "mypy>=1.10"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = []

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
